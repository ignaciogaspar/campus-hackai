# Claude responde cuando alguien lo menciona con @claude en un comentario de un
# PR o de una issue: por ejemplo «@claude revisá de nuevo» después de nuevos
# pushes, «@claude arreglá este typo» o «@claude sumá a la guía de review que
# esto no se marca». Las reviews siguen docs/agents/review.md. Solo le hace
# caso a quien tiene permiso de escritura en el repo.
#
# Necesita lo mismo que claude-review.yml: el secreto y la GitHub App de Claude.
# GitHub corre este workflow desde main: hasta que se mergea, @claude no hace nada.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Ver si hay credenciales de Claude
        id: credenciales
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Falta el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN: Claude no puede responder. Cómo cargarlo: hackai/README.md, «CI».'
          fi

      # Historia completa, para comparar el PR contra main.
      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.hay == 'si'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.credenciales.outputs.hay == 'si'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Respondé en español rioplatense, con voseo, como el resto del repo. Si te piden una review de un PR, seguí docs/agents/review.md. Si te piden sumar algo a la guía de review, editá docs/agents/review.md."
