# Review de Claude en cada PR que no es draft, con el plugin oficial code-review:
# revisa contra CLAUDE.md (que importa AGENTS.md) y busca bugs en el diff.
# Deja un comentario en línea por hallazgo, o un resumen si no encuentra nada.
#
# Corre una vez al abrir o reabrir el PR y cuando pasa de draft a listo, no en
# cada push, para cuidar el costo. Para otra review, comentá @claude en el PR
# (claude.yml).
#
# Necesita el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN y la GitHub
# App de Claude instalada (hackai/README.md, «CI»). Sin secreto avisa y no hace
# nada, así el PR no queda en rojo.
name: Review de Claude

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Ver si hay credenciales de Claude
        id: credenciales
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Falta el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN: la review de Claude no corre. Cómo cargarlo: hackai/README.md, «CI».'
          fi

      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.hay == 'si'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.credenciales.outputs.hay == 'si'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Escribí los comentarios de la review en español rioplatense, con voseo, como el resto del repo."
