# Review de Claude en cada PR que no es draft, siguiendo docs/agents/review.md:
# contrasta el PR con la issue que cierra, las reglas de AGENTS.md y los bugs,
# deja un comentario en línea por hallazgo y un resumen al final. Para que
# revise mejor, se corrige la guía, no este archivo.
#
# Corre una vez por PR, para cuidar el costo: al abrirlo o reabrirlo, cuando
# pasa de draft a listo y, en un push, solo si el PR todavía no tiene la label
# revisado-por-claude, que se pone cuando una review termina bien. Lo del push
# es porque GitHub no corre ningún workflow mientras el PR tiene conflictos con
# main: un PR que se abre con conflictos no tenía review nunca, y así la recibe
# en el primer push que los resuelve. También reintenta una review que falló.
# Para otra review: sacale la label al PR y pusheá, o comentá @claude
# (claude.yml).
#
# Necesita el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN y la GitHub
# App de Claude instalada (hackai/README.md, «CI»). Sin secreto avisa y no hace
# nada, así el PR no queda en rojo.
name: Review de Claude

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  # Una review en curso no se corta: un push que llega mientras revisa espera a
  # que termine y después ve que el PR ya tiene review. Si se cortara, cada
  # push la empezaría de nuevo.
  cancel-in-progress: false

jobs:
  review:
    # En un push, solo sin la label: así ni arranca la máquina en el caso común.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'synchronize' || !contains(github.event.pull_request.labels.*.name, 'revisado-por-claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      # La action escribe `conclusion` solo si Claude corrió: si se saltea (por
      # ejemplo, en un PR que cambia este archivo) termina en verde igual, y el
      # PR no tiene que quedar marcado como revisado.
      reviso: ${{ steps.claude.outputs.conclusion == 'success' && 'si' || '' }}
    steps:
      # Un push que esperó a que termine otra review trae las labels de antes
      # de que esa review pusiera la suya: se vuelven a mirar ahora.
      - name: Ver si hace falta la review
        id: falta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" = synchronize ] && gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx revisado-por-claude; then
            echo '::notice::Este PR ya tiene review de Claude. Para otra, sacale la label revisado-por-claude y pusheá, o comentá @claude.'
          else
            echo 'review=si' >> "$GITHUB_OUTPUT"
          fi

      - name: Ver si hay credenciales de Claude
        id: credenciales
        if: steps.falta.outputs.review == 'si'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Falta el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN: la review de Claude no corre. Cómo cargarlo: hackai/README.md, «CI».'
          fi

      # Historia completa, para comparar el PR contra main.
      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.hay == 'si'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.credenciales.outputs.hay == 'si'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revisá el PR #${{ github.event.pull_request.number }} de ${{ github.repository }}.
            Seguí docs/agents/review.md de punta a punta: juntá el contexto, mirá los seis puntos en orden y comentá como dice la guía.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

  # Aparte de la review, para que solo este job pueda escribir labels.
  marcar:
    needs: review
    if: needs.review.outputs.reviso == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues para crear la label; pull-requests para ponérsela a un PR.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Marcar el PR como revisado
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh label create revisado-por-claude --repo "$REPO" --color 5319e7 \
            --description 'Ya tiene la review automática de Claude; sacala para pedir otra en el próximo push' 2>/dev/null || true
          gh api --method POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=revisado-por-claude' --silent
