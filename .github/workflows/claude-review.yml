# Review de Claude en cada PR que no es draft, siguiendo docs/agents/review.md:
# contrasta el PR con la issue que cierra, las reglas de AGENTS.md y los bugs,
# deja un comentario en línea por hallazgo y un resumen al final. Para que
# revise mejor, se corrige la guía, no este archivo.
#
# Corre una vez al abrir o reabrir el PR y cuando pasa de draft a listo, no en
# cada push, para cuidar el costo. Para otra review, comentá @claude en el PR
# (claude.yml).
#
# Necesita el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN y la GitHub
# App de Claude instalada (hackai/README.md, «CI»). Sin secreto avisa y no hace
# nada, así el PR no queda en rojo.
name: Review de Claude

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Ver si hay credenciales de Claude
        id: credenciales
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Falta el secreto ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN: la review de Claude no corre. Cómo cargarlo: hackai/README.md, «CI».'
          fi

      # Historia completa, para comparar el PR contra main.
      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.hay == 'si'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.credenciales.outputs.hay == 'si'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revisá el PR #${{ github.event.pull_request.number }} de ${{ github.repository }}.
            Seguí docs/agents/review.md de punta a punta: juntá el contexto, mirá los seis puntos en orden y comentá como dice la guía.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
